[package]
name = "arsenal-filecompiler"
version = "2.0.0"
description = "Arsenal File Compiler - Organize PDFs from XML orders via NAS"
authors = ["Arsenal"]
edition = "2021"

[lib]
name = "arsenal_filecompiler_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "arsenal-filecompiler"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
pavao = "0.2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
dirs = "5"
anyhow = "1"

[dev-dependencies]
tempfile = "3.27.0"
